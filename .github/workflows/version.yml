name: Create release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: How the next version is selected
        required: true
        default: auto
        type: choice
        options:
          - auto
          - manual
      manual_bump:
        description: Version change used in manual mode
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Update version and create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Calculate and update version
        id: version
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          MANUAL_BUMP: ${{ inputs.manual_bump }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          previous_tag="$(python3 release.py latest)"
          automatic_version="$(python3 release.py next --bump auto)"

          if [ "$RELEASE_MODE" = "manual" ]; then
            version="$(python3 release.py next --bump "$MANUAL_BUMP")"
            selection="manual ($MANUAL_BUMP)"
          else
            version="$automatic_version"
            selection="auto"
          fi

          python3 release.py update "$version" --previous "$previous_tag"
          python3 release.py verify "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing Moonlight Vita $version from ${previous_tag:-the initial release}"

          current_version="${previous_tag:-none}"
          {
            echo "## Release version"
            echo
            echo "| Current | Automatic suggestion | Selection | Release |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$current_version\` | \`$automatic_version\` | $selection | \`$version\` |"
            echo
            python3 release.py notes "$version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit release files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR_ID: ${{ github.actor_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_files=(
            CMakeLists.txt
            CHANGELOG.md
            psv/sce_sys/livearea/contents/template.xml
            resources/changeinfo.xml
            sce_sys/livearea/contents/template.xml
          )

          if git diff --quiet -- "${release_files[@]}"; then
            echo "Release files already describe $VERSION"
            exit 0
          fi

          git config user.name "$GITHUB_ACTOR"
          git config user.email "${ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -- "${release_files[@]}"
          git commit -m "chore(release): prepare $VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Create release tag
        env:
          ACTOR_ID: ${{ github.actor_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$VERSION" -m "Moonlight Vita $VERSION"
          git push origin "refs/tags/$VERSION"

  publish:
    name: Build and publish
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch origin "$DEFAULT_BRANCH"

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Release tag $VERSION does not exist" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$VERSION" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $VERSION is not part of the default branch $DEFAULT_BRANCH" >&2
            exit 1
          fi

          git checkout --detach "$VERSION"
          git submodule sync --recursive
          git submodule update --init --recursive
          python3 release.py verify "$VERSION"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl wget unzip \
            libarchive-tools pkg-config fakeroot patch python3 bzip2 xz-utils

      - name: Install VitaSDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vitasdk/vdpm.git "$RUNNER_TEMP/vdpm"
          "$RUNNER_TEMP/vdpm/bootstrap-vitasdk.sh" --install-dir "$VITASDK"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: ./scripts/prepare/install_all.sh

      - name: Build release VPK
        run: ./makepsv --gxm --release --clean --no-deploy

      - name: Prepare release asset and notes
        run: |
          set -euo pipefail
          mkdir -p dist
          cp cmake-build-psv-linux-gxm/moonlight.vpk \
            dist/moonlight.vpk
          python3 release.py notes "$VERSION" > dist/release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: moonlight-vita-${{ needs.prepare.outputs.version }}
          path: dist/moonlight.vpk
          if-no-files-found: error

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          asset="dist/moonlight.vpk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$asset" --clobber
            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes-file dist/release-notes.md \
              --latest
          else
            gh release create "$VERSION" "$asset" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file dist/release-notes.md \
              --latest
          fi
