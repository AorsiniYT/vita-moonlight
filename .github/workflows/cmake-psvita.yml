name: Build PSVita (CMake)

on:
  push:
    branches: [ vita ]
  pull_request:
    branches: [ vita ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 python3-pip curl git

      - name: Clean up old VitaSDK if present
        run: |
          rm -rf $GITHUB_WORKSPACE/vitasdk

      - name: Install VitaSDK and packages manually
        run: |
          set -e
          # Download and extract the base SDK
          SDK_URL=$(wget -qO- https://github.com/vitasdk/vita-headers/raw/master/.travis.d/last_built_toolchain.py | python3 - master linux)
          echo "Downloading VitaSDK: $SDK_URL"
          mkdir -p $GITHUB_WORKSPACE/vitasdk
          wget -O- "$SDK_URL" | tar xj -C $GITHUB_WORKSPACE/vitasdk --strip-components=1
          export VITASDK=$GITHUB_WORKSPACE/vitasdk
          export PATH=$VITASDK/bin:$PATH
          echo "VITASDK: $VITASDK"
          echo "PATH: $PATH"
          # Install all main packages
          git clone https://github.com/vitasdk/vdpm.git
          for p in zlib bzip2 libzip libpng libexif libjpeg-turbo jansson yaml-cpp freetype harfbuzz fftw libvita2d libvita2d_ext libmad libogg libvorbis flac libtheora libtremor libmikmod libftpvita henkaku taihen kubridge libk libdebugnet onigmo libwebp sdl sdl_image sdl_mixer sdl_net sdl_ttf sdl_gfx sdl2 sdl2_image sdl2_mixer sdl2_net sdl2_ttf sdl2_gfx openal-soft openssl curl curlpp expat opus opusfile unrar glm libxml2 speexdsp pixman TinyGL kuio taipool mpg123 libmpeg2 soloud quirc Box2D libsndfile xz libarchive bullet libimagequant libmodplug libconfig libsodium vitaShaRK libmathneon vitaGL imgui imgui-vita2d libbaremetal minizip jsoncpp lame ffmpeg physfs vita-rss-libdl luajit tinyxml2 cpython cpython3 asio assimp opensles cpr libintl libopenmpt libvpx zstd libpcre2 fribidi libass websocketpp wslay SceShaccCgExt boost pib libxmp libxmp-lite sdl3 sdl3_image sdl3_ttf; do
            ./vdpm/vdpm -f $p
          done
          # Explicitly install mbedtls
          ./vdpm/vdpm -f mbedtls
          echo "Contents of $VITASDK after installing packages:"
          ls -l $VITASDK
          echo "Contents of $VITASDK/arm-vita-eabi:"
          ls -l $VITASDK/arm-vita-eabi || echo "arm-vita-eabi does not exist"
          echo "Contents of $VITASDK/share:"
          ls -l $VITASDK/share || echo "share does not exist"
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Update submodules and build
        run: |
          git submodule update --init
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VITASDK }}/share/vita.toolchain.cmake"
          cd build
          make

      - name: List build outputs
        run: |
          ls -lh build

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-vpk
          path: build/*.vpk
