name: clang-format

on:
  push:
    paths:
      - .clang-format
      - .github/workflows/clang-format.yml
      - "moonlight/**/*.c"
      - "moonlight/**/*.cc"
      - "moonlight/**/*.cpp"
      - "moonlight/**/*.cxx"
      - "moonlight/**/*.h"
      - "moonlight/**/*.hh"
      - "moonlight/**/*.hpp"
      - "moonlight/**/*.hxx"
  pull_request:
    paths:
      - .clang-format
      - .github/workflows/clang-format.yml
      - "moonlight/**/*.c"
      - "moonlight/**/*.cc"
      - "moonlight/**/*.cpp"
      - "moonlight/**/*.cxx"
      - "moonlight/**/*.h"
      - "moonlight/**/*.hh"
      - "moonlight/**/*.hpp"
      - "moonlight/**/*.hxx"

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: python -m pip install --disable-pip-version-check clang-format==19.1.5

      - name: Check formatting
        run: |
          find moonlight/src moonlight/include -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \) \
            -print0 | xargs -0 clang-format \
              --dry-run --Werror --style=file --fallback-style=none
